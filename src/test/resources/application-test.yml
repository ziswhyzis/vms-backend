spring:
  datasource:
    url: jdbc:h2:mem:vms-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: false

app:
  jwt:
    secret: test-secret-key-for-stark-group-vms-tests-only-32-bytes-minimum
    expiration-minutes: 60
  cors:
    # Mirrors the shipped defaults: a wildcard pattern for local development
    # plus an exact production origin.
    allowed-origins: http://localhost:[*],http://127.0.0.1:[*],https://stark-group-vms.netlify.app
  seed:
    enabled: false
