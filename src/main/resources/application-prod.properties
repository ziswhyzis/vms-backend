# Production profile - PostgreSQL on Render (or any hosted PostgreSQL).
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false

# Render provides $PORT.
server.port=${PORT:8080}

# Fail fast instead of silently falling back to a development secret.
app.jwt.secret=${APP_JWT_SECRET}

# The bootstrap operator password must be supplied by the platform secret store
# (render.yaml generates a random value). Nothing is seeded without it.
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD}
